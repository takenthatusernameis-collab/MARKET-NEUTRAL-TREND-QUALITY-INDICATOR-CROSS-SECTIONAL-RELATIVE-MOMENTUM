name: Bybit Multi-Cloud Egress Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bybit-multicloud-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-multicloud-egress-probe
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.probe_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe_id: ubuntu-22.04-a
            runner: ubuntu-22.04
          - probe_id: ubuntu-22.04-b
            runner: ubuntu-22.04
          - probe_id: ubuntu-24.04-a
            runner: ubuntu-24.04
          - probe_id: ubuntu-24.04-b
            runner: ubuntu-24.04
          - probe_id: ubuntu-26.04-a
            runner: ubuntu-26.04
          - probe_id: ubuntu-26.04-b
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Probe the official Bybit Global public server-time endpoint once
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          url = "https://api.bybit.com/v5/market/time"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "market-neutral-trend-quality-research/egress-probe"},
          )
          try:
              with urllib.request.urlopen(request, timeout=12) as response:
                  status = response.status
                  body = response.read(16000).decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read(16000).decode("utf-8", errors="replace")
          except Exception as exc:
              print(json.dumps({
                  "result": "NETWORK_ERROR",
                  "url": url,
                  "error_type": type(exc).__name__,
                  "error": str(exc)[:500],
              }, indent=2))
              sys.exit(1)

          try:
              payload = json.loads(body)
          except json.JSONDecodeError:
              payload = None

          result = payload.get("result", {}) if isinstance(payload, dict) else {}
          valid_time = any(
              str(result.get(field, "")).isdigit() and int(result.get(field, 0)) > 0
              for field in ("timeNano", "timeSecond")
          )
          ok = status == 200 and isinstance(payload, dict) and payload.get("retCode") == 0 and valid_time
          print(json.dumps({
              "result": "PASS" if ok else "FAIL",
              "url": url,
              "http_status": status,
              "retCode": payload.get("retCode") if isinstance(payload, dict) else None,
              "retMsg": payload.get("retMsg") if isinstance(payload, dict) else None,
              "valid_server_time": valid_time,
              "response_excerpt": None if ok else body[:800],
              "credentials_used": False,
              "proxy_configured": False,
              "orders_submitted": 0,
          }, indent=2))
          sys.exit(0 if ok else 1)
          PY
