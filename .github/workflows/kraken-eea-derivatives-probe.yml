name: Kraken EEA Derivatives Public API Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kraken-eea-derivatives-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kraken-eea-derivatives-public-probe
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.runner_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_id: ubuntu-22.04
            runner: ubuntu-22.04
          - runner_id: ubuntu-24.04
            runner: ubuntu-24.04
          - runner_id: ubuntu-26.04
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Validate EEA linear perpetual public market-data endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from decimal import Decimal, InvalidOperation
          from html.parser import HTMLParser
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          REST = "https://futures.kraken.com/derivatives/api/v3"
          CHARTS = "https://futures.kraken.com/api/charts/v1"
          headers = {
              "Accept": "application/json",
              "User-Agent": "market-neutral-trend-quality-research/kraken-eea-probe",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                      raw = response.read(4_000_000).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(4_000_000).decode("utf-8", errors="replace")
              except Exception as exc:
                  return {
                      "http_status": None,
                      "network_error": type(exc).__name__,
                      "error": str(exc)[:500],
                  }
              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError:
                  payload = None
              return {
                  "http_status": status,
                  "payload": payload,
                  "body_excerpt": None if isinstance(payload, dict) else raw[:1000],
              }

          def rest(path, params=None):
              query = urllib.parse.urlencode(params or {})
              return get_json(REST + path + ("?" + query if query else ""))

          def chart(path, params=None):
              query = urllib.parse.urlencode(params or {})
              return get_json(CHARTS + path + ("?" + query if query else ""))

          class EeaPerpetualSpecsParser(HTMLParser):
              """Extract Kraken's official EEA perpetual contract specification table."""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.in_cell = False

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th") and self.row is not None:
                      self.cell = []
                      self.in_cell = True

              def handle_data(self, data):
                  if self.in_cell and self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th") and self.in_cell and self.row is not None:
                      self.row.append(" ".join("".join(self.cell or []).split()))
                      self.cell = None
                      self.in_cell = False
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None

              def contract_specs(self):
                  result = {}
                  for cells in self.rows:
                      if len(cells) < 6:
                          continue
                      match = re.search(r"\\bPF_[A-Z0-9]+\\b", cells[0])
                      if match is None:
                          continue
                      symbol = match.group(0)
                      try:
                          minimum_lot = Decimal(cells[2].replace(",", ""))
                          tick_size = Decimal(cells[3].replace(",", ""))
                          maximum_position = Decimal(cells[4].replace(",", ""))
                      except (InvalidOperation, ValueError):
                          continue
                      if not all(
                          value.is_finite() and value > 0
                          for value in (minimum_lot, tick_size, maximum_position)
                      ):
                          continue
                      result[symbol] = {
                          "minimum_lot": minimum_lot,
                          "tick_size": tick_size,
                          "maximum_position": maximum_position,
                          "margin_class": cells[5],
                      }
                  return result

              def request_specs(self):
                  request = urllib.request.Request(
                      "https://support.kraken.com/articles/perpetual-contract-specifications-for-clients-in-the-eea",
                      headers={
                          "Accept": "text/html",
                          "User-Agent": "market-neutral-trend-quality-research/kraken-eea-probe",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status = response.status
                          raw = response.read(8_000_000).decode("utf-8", errors="replace")
                      parser = EeaPerpetualSpecsParser()
                      parser.feed(raw)
                      return status, parser.contract_specs(), None
                  except urllib.error.HTTPError as exc:
                      return exc.code, {}, exc.read(2000).decode("utf-8", errors="replace")
                  except Exception as exc:
                      return None, {}, f"{type(exc).__name__}: {str(exc)[:500]}"

          def valid_success(result):
              payload = result.get("payload")
              return (
                  result.get("http_status") == 200
                  and isinstance(payload, dict)
                  and payload.get("result") == "success"
                  and not payload.get("error")
                  and not payload.get("errors")
              )

          instrument_result = rest("/instruments")
          payload = instrument_result.get("payload")
          all_instruments = (
              payload.get("instruments", [])
              if isinstance(payload, dict)
              and isinstance(payload.get("instruments"), list)
              else []
          )
          pf = [
              x for x in all_instruments
              if isinstance(x, dict)
              and str(x.get("symbol", "")).startswith("PF_")
              and str(x.get("symbol", "")).endswith("USD")
              and x.get("tradeable") is True
              and x.get("suspended") is False
              and isinstance(x.get("countriesBanned"), list)
              and "RO" not in x.get("countriesBanned", [])
              and isinstance(x.get("platformsPermitted"), list)
              and (
                  "europa_crypto" in x.get("platformsPermitted", [])
                  or "europa" in x.get("platformsPermitted", [])
                  or "payward_digital_solutions" in x.get("platformsPermitted", [])
              )
          ]
          # Kraken's native category field is the authoritative classification
          # field. Permission tags alone do not distinguish crypto from xStocks,
          # equity indices or commodity indices.
          category_counts = Counter(
              str(row.get("category") or "UNCLASSIFIED") for row in pf
          )
          crypto_categories = {
              "AI", "Community", "DEX", "DeFi", "DePIN", "Gaming",
              "Infrastructure", "Layer 1", "Layer 2", "Meme",
              "Privacy", "Utility", "Web3",
          }
          non_crypto_categories = {
              "Commodities", "Equities", "Indices", "xStocks",
              "Forex", "Pre-IPO", "Real-world assets", "Stablecoin",
          }
          known_categories = crypto_categories | non_crypto_categories
          unclassified_pf = [
              row for row in pf
              if not isinstance(row.get("category"), str)
              or row.get("category") not in known_categories
          ]
          crypto_category_rows = [
              row for row in pf if row.get("category") in crypto_categories
          ]
          crypto_permission_missing = [
              row for row in crypto_category_rows
              if "europa_crypto" not in row.get("platformsPermitted", [])
          ]
          crypto_pf = [
              row for row in crypto_category_rows
              if "europa_crypto" in row.get("platformsPermitted", [])
          ]
          crypto_category_counts = Counter(
              str(row.get("category")) for row in crypto_pf
          )
          stablecoin_category_rows = [
              row for row in pf if row.get("category") == "Stablecoin"
          ]
          def has_europe_retail_margin(row):
              schedules = row.get("marginSchedules")
              if not isinstance(schedules, dict):
                  return False
              europe_crypto = schedules.get("europa_crypto")
              if not isinstance(europe_crypto, dict):
                  return False
              retail = europe_crypto.get("retail")
              return isinstance(retail, list) and bool(retail)

          def has_valid_contract_precision(row):
              try:
                  return (
                      float(row.get("tickSize", 0)) > 0
                      and float(row.get("contractSize", 0)) > 0
                      and float(row.get("maxPositionSize", 0)) > 0
                      and int(row.get("contractValueTradePrecision", 0)) >= 0
                  )
              except (TypeError, ValueError, OverflowError):
                  return False

          precision_ready_count = sum(
              has_valid_contract_precision(row) for row in crypto_pf
          )
          eeea_retail_margin_count = sum(
              has_europe_retail_margin(row) for row in crypto_pf
          )
          margin_precision_qualified_crypto = [
              row for row in crypto_pf
              if has_valid_contract_precision(row) and has_europe_retail_margin(row)
          ]
          margin_precision_qualified_count = len(margin_precision_qualified_crypto)

          specs_http_status, official_specs, specs_error = EeaPerpetualSpecsParser().request_specs()
          official_spec_matched = {}
          official_spec_mismatches = {}
          for row in margin_precision_qualified_crypto:
              instrument_symbol = str(row.get("symbol", ""))
              spec = official_specs.get(instrument_symbol)
              if spec is None:
                  official_spec_mismatches[instrument_symbol] = "MISSING_FROM_OFFICIAL_EEA_SPEC_TABLE"
                  continue
              try:
                  api_tick = Decimal(str(row.get("tickSize")))
                  api_max_position = Decimal(str(row.get("maxPositionSize")))
              except (InvalidOperation, ValueError):
                  official_spec_mismatches[instrument_symbol] = "INVALID_API_PRECISION_METADATA"
                  continue
              if (
                  not api_tick.is_finite()
                  or not api_max_position.is_finite()
                  or api_tick != spec["tick_size"]
                  or api_max_position != spec["maximum_position"]
              ):
                  official_spec_mismatches[instrument_symbol] = {
                      "api_tick_size": str(api_tick),
                      "official_tick_size": str(spec["tick_size"]),
                      "api_max_position": str(api_max_position),
                      "official_max_position": str(spec["maximum_position"]),
                  }
                  continue
              official_spec_matched[instrument_symbol] = spec

          symbol = "PF_XBTUSD"
          official_spec_coverage_count = len(official_spec_matched)
          official_spec_consistent = not official_spec_mismatches
          official_btc_spec = official_spec_matched.get(symbol)
          permission_tagged_crypto = [
              row for row in pf
              if "europa_crypto" in row.get("platformsPermitted", [])
          ]
          known_classification_symbols = (
              "PF_XBTUSD", "PF_ETHUSD", "PF_SOLUSD",
              "PF_AAPLXUSD", "PF_SNDKUSD", "PF_XAGUSD", "PF_XAUTUSD",
              "PF_XAUUSD", "PF_XCUUSD", "PF_US100USD", "PF_WTIOILUSD",
              "PF_EWYUSD", "PF_EWZUSD", "PF_SAMSUNGUSD", "PF_SKHYUSD",
          )
          classification_samples = {
              str(row.get("symbol")): {
                  key: row.get(key)
                  for key in (
                      "symbol", "type", "base", "quote", "pair",
                      "platformsPermitted", "countriesBanned", "underlying",
                      "contractType", "category", "isin", "contractSize",
                      "contractValueTradePrecision",
                  )
                  if key in row
              }
              for row in all_instruments
              if isinstance(row, dict)
              and row.get("symbol") in known_classification_symbols
          }
          btc_contract_execution_ready = any(
              row.get("symbol") == symbol for row in margin_precision_qualified_crypto
          )

          tickers = rest("/tickers")
          ticker_payload = tickers.get("payload")
          ticker_rows = (
              ticker_payload.get("tickers", [])
              if isinstance(ticker_payload, dict)
              and isinstance(ticker_payload.get("tickers"), list)
              else []
          )
          ticker = next(
              (x for x in ticker_rows if isinstance(x, dict) and x.get("symbol") == symbol),
              None,
          )

          book = rest("/orderbook", {"symbol": symbol})
          book_payload = book.get("payload")
          book_data = (
              book_payload.get("orderBook")
              if isinstance(book_payload, dict)
              else None
          )
          if not isinstance(book_data, dict) and isinstance(book_payload, dict):
              book_data = book_payload.get("orderbook")

          import time
          from datetime import datetime, timezone
          now_seconds = int(time.time())
          utc_today_start = (now_seconds // 86400) * 86400
          latest_completed_daily_start = (utc_today_start - 86400) * 1000
          candle_attempts = {}
          for candidate_symbol in (symbol, "PF_BTCUSD", "PI_XBTUSD"):
              for tick_type in ("trade", "mark"):
                  route = f"/{tick_type}/{candidate_symbol}/1d"
                  result = chart(
                      route,
                      {"from": str(now_seconds - 5 * 86400), "to": str(now_seconds), "count": "5"},
                  )
                  candle_attempts[route] = result
                  payload_candidate = result.get("payload")
                  if (
                      result.get("http_status") == 200
                      and isinstance(payload_candidate, dict)
                      and isinstance(payload_candidate.get("candles"), list)
                      and payload_candidate.get("candles")
                  ):
                      candles = result
                      break
              else:
                  continue
              break
          else:
              candles = candle_attempts.get(f"/trade/{symbol}/1d", {})
          candles_payload = candles.get("payload")
          candle_rows = (
              candles_payload.get("candles", [])
              if isinstance(candles_payload, dict)
              and isinstance(candles_payload.get("candles"), list)
              else []
          )

          funding = get_json(REST.replace("/api/v3", "/api/v4") + "/historicalfundingrates?" + urllib.parse.urlencode({"symbol": symbol}))
          funding_payload = funding.get("payload")
          funding_rows = (
              funding_payload.get("rates", [])
              if isinstance(funding_payload, dict)
              and isinstance(funding_payload.get("rates"), list)
              else []
          )

          latest_candle_time = max(
              (int(row.get("time", 0)) for row in candle_rows if isinstance(row, dict)),
              default=0,
          )
          completed_candle_times = [
              int(row.get("time", 0))
              for row in candle_rows
              if isinstance(row, dict)
              and 0 < int(row.get("time", 0)) < utc_today_start * 1000
          ]
          latest_completed_candle_time = max(completed_candle_times, default=0)
          funding_timestamps = []
          funding_rates_valid = True
          for row in funding_rows:
              try:
                  timestamp = datetime.fromisoformat(
                      str(row["timestamp"]).replace("Z", "+00:00")
                  ).timestamp()
                  absolute_rate = float(row["fundingRate"])
                  relative_rate = float(row["relativeFundingRate"])
                  funding_timestamps.append(int(timestamp))
                  if not (abs(absolute_rate) < float("inf") and abs(relative_rate) < float("inf")):
                      funding_rates_valid = False
              except (KeyError, TypeError, ValueError, OverflowError):
                  funding_rates_valid = False
          latest_funding_timestamp = max(funding_timestamps, default=0)
          checks = {
              "instruments": (
                  valid_success(instrument_result)
                  and len(crypto_pf) >= 50
                  and not unclassified_pf
              ),
              "margin_precision_qualified_universe_minimum": margin_precision_qualified_count >= 50,
              "btc_in_margin_precision_qualified_universe": btc_contract_execution_ready,
              "official_minimum_lot_spec_coverage": (
                  official_spec_coverage_count >= 50
                  and official_spec_consistent
              ),
              "btc_official_minimum_lot_spec": official_btc_spec is not None,
              "eea_crypto_platform_permissions": (
                  bool(crypto_pf) and not crypto_permission_missing
              ),
              "eea_retail_margin_metadata": eeea_retail_margin_count >= 50,
              "contract_precision_metadata": precision_ready_count >= 50,
              "intersection_of_eea_margin_and_precision": margin_precision_qualified_count >= 50,
              "ticker": valid_success(tickers) and ticker is not None,
              "orderbook": (
                  valid_success(book)
                  and isinstance(book_data, dict)
                  and bool(book_data.get("asks"))
                  and bool(book_data.get("bids"))
              ),
              "latest_completed_daily_candle": (
                  candles.get("http_status") == 200
                  and isinstance(candles_payload, dict)
                  and latest_completed_candle_time >= latest_completed_daily_start
              ),
              "recent_settled_funding_history": (
                  valid_success(funding)
                  and bool(funding_rows)
                  and funding_rates_valid
                  and latest_funding_timestamp >= now_seconds - 2 * 3600
                  and latest_funding_timestamp <= now_seconds
              ),
          }

          report = {
              "exchange": "Kraken Futures — EEA multi-collateral linear",
              "base_url": REST,
              "credentials_used": False,
              "private_endpoints_used": False,
              "orders_submitted": 0,
              "instrument_http_status": instrument_result.get("http_status"),
              "instrument_api_result": payload.get("result") if isinstance(payload, dict) else None,
              "all_instrument_count": len(all_instruments),
              "tradeable_pf_usd_count": len(pf),
              "eea_platform_permitted_pf_usd_count": len(pf),
              "category_counts": dict(sorted(category_counts.items())),
              "crypto_category_counts": dict(sorted(crypto_category_counts.items())),
              "crypto_category_and_permission_count": len(crypto_pf),
              "eea_margin_precision_qualified_crypto_perpetual_count": margin_precision_qualified_count,
              "official_eea_specs_http_status": specs_http_status,
              "official_eea_minimum_lot_specs_matched_count": official_spec_coverage_count,
              "official_eea_minimum_lot_spec_mismatch_count": len(official_spec_mismatches),
              "official_eea_minimum_lot_spec_error": specs_error,
              "official_eea_minimum_lot_spec_sample": {
                  key: {
                      "minimum_lot": str(value["minimum_lot"]),
                      "tick_size": str(value["tick_size"]),
                      "maximum_position": str(value["maximum_position"]),
                      "margin_class": value["margin_class"],
                  }
                  for key, value in list(official_spec_matched.items())[:8]
              },
              "official_eea_minimum_lot_spec_mismatches": dict(list(official_spec_mismatches.items())[:20]),
              "crypto_category_missing_europa_crypto_permission_count": len(crypto_permission_missing),
              "non_directional_stablecoin_contract_count": len(stablecoin_category_rows),
              "unclassified_pf_count": len(unclassified_pf),
              "unclassified_categories": sorted({
                  str(row.get("category") or "UNCLASSIFIED")
                  for row in unclassified_pf
              }),
              "excluded_non_crypto_category_count": sum(
                  category_counts.get(category, 0) for category in non_crypto_categories
              ),
              "europa_crypto_permission_count": len(permission_tagged_crypto),
              "europa_general_only_pf_count": sum(
                  "europa" in row.get("platformsPermitted", [])
                  and "europa_crypto" not in row.get("platformsPermitted", [])
                  for row in pf
              ),
              "classification_samples_by_known_symbol": classification_samples,
              "eea_retail_margin_metadata_count": eeea_retail_margin_count,
              "valid_contract_precision_metadata_count": precision_ready_count,
              "eea_margin_and_precision_intersection_count": margin_precision_qualified_count,
              "excluded_ro_banned_count": sum(
                  1 for row in all_instruments
                  if isinstance(row, dict) and "RO" in row.get("countriesBanned", [])
              ),
              "sample_crypto_perpetuals": margin_precision_qualified_crypto[:8],
              "sample_btc_contract": next(
                  (x for x in margin_precision_qualified_crypto if x.get("symbol") == symbol), None
              ),
              "instrument_metadata_gap": (
                  "The public instrument payload omits minimum lot size; the probe separately "
                  "reconciles minimum lot, tick size and maximum position against Kraken's "
                  "official EEA specification table. Per-contract sizing remains blocked if "
                  "any contract is missing or mismatched."
              ),
              "ticker": {
                  "http_status": tickers.get("http_status"),
                  "sample": ticker,
              },
              "orderbook": {
                  "http_status": book.get("http_status"),
                  "sample": book_data,
                  "body_excerpt": book.get("body_excerpt"),
              },
              "candle_attempts": {
                  name: {"http_status": result.get("http_status"), "payload": result.get("payload"), "body_excerpt": result.get("body_excerpt")}
                  for name, result in candle_attempts.items()
              },
              "daily_candles": {
                  "http_status": candles.get("http_status"),
                  "latest_candle_time_ms": latest_candle_time,
                  "latest_completed_candle_time_ms": latest_completed_candle_time,
                  "latest_completed_daily_start_ms": latest_completed_daily_start,
                  "sample_first": candle_rows[:1],
                  "sample_last": candle_rows[-2:],
                  "body_excerpt": candles.get("body_excerpt"),
              },
              "funding_history": {
                  "http_status": funding.get("http_status"),
                  "row_count": len(funding_rows),
                  "latest_funding_timestamp": datetime.fromtimestamp(latest_funding_timestamp, tz=timezone.utc).isoformat() if latest_funding_timestamp else None,
                  "sample_first": funding_rows[:1],
                  "sample_last": funding_rows[-2:],
                  "body_excerpt": funding.get("body_excerpt"),
              },
              "checks": checks,
              "technical_market_data_pass": all(checks.values()),
              "jurisdiction_status": "EEA_DERIVATIVES_PRODUCT_DOCUMENTED; INDIVIDUAL_ONBOARDING_REQUIRED",
              "collateral_status": "CURRENT EEA COLLATERAL LIST INCLUDES USDT AND USDC; BOTH 0.50% HAIRCUT; USD PNL DEFAULT",
              "candidate_ready": False,
              "candidate_status": (
                  "TECHNICALLY_COMPATIBLE_EEA_PRODUCT_PENDING_ADAPTER_AND_ACCOUNT_ONBOARDING"
                  if all(checks.values()) else "NOT_READY"
              ),
          }
          print(json.dumps(report, indent=2, default=str))
          raise SystemExit(0 if all(checks.values()) else 1)
          PY
