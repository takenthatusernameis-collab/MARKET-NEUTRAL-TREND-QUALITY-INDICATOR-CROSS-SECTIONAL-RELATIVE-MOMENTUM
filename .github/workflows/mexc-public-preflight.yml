name: "DIAGNOSTIC ONLY — MANUAL READ-ONLY MEXC PREFLIGHT — NOT THE $50 PAPER ACCOUNT"

run-name: "MANUAL READ-ONLY DIAGNOSTIC — NO PAPER ACCOUNT OR STATE — run #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-state-branch-single-writer
  cancel-in-progress: false

jobs:
  public-data:
    name: "READ-ONLY MEXC CONTRACT CHECK — no account or paper-state changes"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install strategy package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unauthenticated MEXC API preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/mexc_public_preflight.py | tee mexc-public-preflight-report.json
      - name: Upload MEXC public-data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexc-public-preflight-report
          path: mexc-public-preflight-report.json
          if-no-files-found: warn
          retention-days: 30
