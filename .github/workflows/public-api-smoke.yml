name: Public API Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/trend_quality/bybit_api.py'
      - '.github/workflows/public-api-smoke.yml'

permissions:
  contents: read

concurrency:
  group: bybit-public-api-smoke
  cancel-in-progress: false

jobs:
  public-api:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Check public API
        run: python -m trend_quality.cli public-api-smoke
