name: ▶ START PAPER SIMULATION — MEXC (PAPER ONLY)

on:
  push:
    branches: [main]
    paths:
      - "src/trend_quality/mexc_api.py"
      - "src/trend_quality/mexc_paper.py"
      - "src/trend_quality/mexc_portfolio.py"
      - "src/trend_quality/market_data_store.py"
      - "src/trend_quality/event_journal.py"
      - "src/trend_quality/paper_performance_report.py"
      - "scripts/build_paper_performance_report.py"
      - "scripts/mexc_paper_cycle.py"
      - ".github/workflows/mexc-paper-cycle.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-state-branch-single-writer
  cancel-in-progress: false

jobs:
  cycle:
    name: ▶ Manual start, five-minute entry retries and portfolio monitoring
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKET_DATA_DIR: ../market-data
      PAPER_STATE_DIR: ../state
      BOOTSTRAP_BATCH_SIZE: "150"
      PAPER_STATE_WRITE_ENABLED: ${{ vars.PAPER_STATE_WRITE_ENABLED || 'true' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out strategy source
        uses: actions/checkout@v4
        with:
          ref: main
          path: strategy
      - name: Check out public market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
          fetch-depth: 0
      # A new account generation first publishes a verified recovery probe.
      # The next invocation must read it from this fresh checkout before creating
      # financial paper state; the probe run itself never initializes capital.
      # Every later snapshot also checks pair neutrality and can size-correct drift.
      - name: Check out immutable paper-event branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install strategy package
        working-directory: strategy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run MEXC data, daily-decision and five-minute monitoring cycle
        id: cycle
        working-directory: strategy
        shell: bash
        run: |
          mkdir -p ../market-data/data/reports/mexc
          set -o pipefail
          python scripts/mexc_paper_cycle.py | tee ../market-data/data/reports/mexc/workflow-last-run.log
      - name: Commit public data, snapshots and research reports
        if: always()
        working-directory: market-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No public market-data changes to commit."
          else
            git commit -m "Append MEXC market data and research snapshot"
            git push origin HEAD:market-data
          fi
      - name: Refresh immutable state checkout after this cycle
        id: refresh_state
        if: always()
        working-directory: state
        shell: bash
        run: |
          git fetch origin state
          git reset --hard FETCH_HEAD
      - name: Build standalone performance report from verified state history
        id: performance_report
        if: always() && steps.refresh_state.outcome == 'success'
        working-directory: strategy
        env:
          PAPER_STATE_DIR: ../state
          PAPER_PERFORMANCE_REPORT_PATH: ../PAPER_PERFORMANCE_REPORT.md
          PAPER_EQUITY_CURVE_SVG_PATH: ../equity_curve.svg
          PAPER_WORKFLOW_OUTCOME: ${{ steps.cycle.outcome }}
          PAPER_WORKFLOW_RUN_ID: ${{ github.run_id }}
          PAPER_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          PAPER_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAPER_WORKFLOW_SERVER_URL: ${{ github.server_url }}
          PAPER_WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_paper_performance_report.py
      - name: Publish standalone performance report to main
        if: always() && steps.performance_report.outcome == 'success'
        shell: bash
        run: |
          git -C strategy config user.name "github-actions[bot]"
          git -C strategy config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C strategy fetch origin main
            git -C strategy checkout -B main origin/main
            cp PAPER_PERFORMANCE_REPORT.md strategy/PAPER_PERFORMANCE_REPORT.md
            cp equity_curve.svg strategy/equity_curve.svg
            git -C strategy add PAPER_PERFORMANCE_REPORT.md equity_curve.svg
            if git -C strategy diff --cached --quiet; then
              echo "Standalone performance report is unchanged."
              exit 0
            fi
            git -C strategy commit -m "Refresh MEXC paper performance report [skip ci]"
            if git -C strategy push origin HEAD:main; then
              exit 0
            fi
            echo "Report push raced with another main update; retrying from latest main."
          done
          echo "Unable to publish report after three fast-forward retries."
          exit 1
      - name: Upload MEXC research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexc-paper-research-report
          path: |
            market-data/data/reports/mexc/
            equity_curve.svg
          if-no-files-found: warn
          retention-days: 30
