name: Retired Polymarket Paper Cycle — Manual Diagnostic Only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-state-branch-single-writer
  cancel-in-progress: false

jobs:
  paper-cycle:
    name: Snapshot, increment candles and process daily Q decision
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out strategy code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: strategy

      - name: Check out public market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
          fetch-depth: 1

      - name: Check out immutable paper-event branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install strategy package
        working-directory: strategy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run five-minute public-data and paper cycle
        working-directory: strategy
        env:
          MARKET_DATA_DIR: ../market-data
          PAPER_STATE_DIR: ../state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOOTSTRAP_BATCH_SIZE: "150"
        run: |
          mkdir -p ../market-data/data/reports
          python scripts/polymarket_paper_cycle.py | tee ../market-data/data/reports/workflow-last-run.log

      - name: Commit market data, snapshots and rebuildable projections
        if: always()
        working-directory: market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Append public Perps market data and paper projection"
            git push origin HEAD:market-data
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-paper-cycle-report
          path: market-data/data/reports/
          if-no-files-found: warn
          retention-days: 30
