name: Ordered 24/7 Perpetual Exchange Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordered-perp-exchange-qualification
  cancel-in-progress: false

jobs:
  public-qualification:
    name: Ordered public API and product qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and test qualification parsers
        run: |
          ruff check .
          pytest
      - name: Probe exchanges in the requested priority order
        run: |
          python scripts/probe_perp_priority.py | tee perp-exchange-qualification.json
      - name: Run full-universe OKX EEA acceptance
        run: |
          python scripts/validate_okx_eea_universe.py | tee okx-eea-full-universe-acceptance.json
      - name: Upload public qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perp-exchange-qualification-reports
          path: |
            perp-exchange-qualification.json
            okx-eea-full-universe-acceptance.json
          if-no-files-found: warn
          retention-days: 30
