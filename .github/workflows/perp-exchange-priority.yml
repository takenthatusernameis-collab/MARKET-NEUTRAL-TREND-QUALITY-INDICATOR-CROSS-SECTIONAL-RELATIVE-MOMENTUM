name: Ordered 24/7 Perpetual Exchange Qualification

on:
  push:
    branches: [main]
    paths:
      - "src/trend_quality/exchange_probe.py"
      - "scripts/probe_perp_priority.py"
      - "tests/test_exchange_probe.py"
      - ".github/workflows/perp-exchange-priority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordered-perp-exchange-qualification
  cancel-in-progress: false

jobs:
  public-qualification:
    name: Ordered public API and product qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and test qualification parsers
        run: |
          ruff check .
          pytest
      - name: Probe exchanges in the requested priority order
        run: |
          python scripts/probe_perp_priority.py | tee perp-exchange-qualification.json
      - name: Upload public qualification report
        uses: actions/upload-artifact@v4
        with:
          name: perp-exchange-qualification-report
          path: perp-exchange-qualification.json
          if-no-files-found: error
          retention-days: 30
